name: Refresh Safety Gate snapshot

on:
  schedule:
    - cron: '0 18 * * 5'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync official Safety Gate data
        run: npm run data:sync -- --weeks=4 --limit=120

      - name: Run release quality gate
        run: npm run release:check

      - name: Upload refresh artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safety-gate-refresh-${{ github.run_id }}
          if-no-files-found: error
          path: |
            src/data/generated/safety-gate-snapshot.json
            dist/

      - name: Open refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(data): refresh Safety Gate snapshot'
          title: 'chore(data): refresh Safety Gate snapshot'
          body: |
            Automated public Safety Gate snapshot refresh.

            Checks run: `npm run release:check`.
            CRA product-level evidence is not inferred from this snapshot.
          branch: automation/safety-gate-refresh
          delete-branch: true
          add-paths: src/data/generated/safety-gate-snapshot.json
